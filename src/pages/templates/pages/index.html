<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Note app</title>
  </head>
  <body>
    <h1>Note app</h1>

    <table>
      <tr>
		    <th style="text-align:left">Username: <td>{{user.username}}
		</table>

    {% if note_list %}
    <table>
        {% for note in note_list %}
            <tr>
              <th>
                <a href="{% url 'notes:note' note.id %}">{{ note.note_text }}</a>
              </th>
              <th>
                <form action='{% url 'notes:delete' note.id %}' method="DELETE">
                  {% csrf_token %}
                  <input type="submit" value="Delete"/>
                </form>
              </th>

            </tr>
        {% endfor %}
          </table>
    {% else %}
        <p>No notes are available.</p>
    {% endif %}

    <h2>Add note</h2>
    <p>
      <form action="{% url 'notes:add' %}" method="post">
        {% csrf_token %}
        <input type="text" name="note_text">
        <input type="submit" value="Add">
      </form>
    </p>


    <p>
      <form action='logout/' method="POST">
        {% csrf_token %}
        <input type="submit" value="Logout"/>
      </form>
    </p>

  </body>
</html>
