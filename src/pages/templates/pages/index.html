<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Note app</title>
  </head>
  <body>
    {% if note_list %}
    <ul>
        {% for note in note_list %}
            <li><a href="{% url 'notes:note' note.id %}">{{ note.note_text }}</a></li>
        {% endfor %}
    </ul>
    {% else %}
        <p>Note notes are available.</p>
    {% endif %}
  </body>
</html>
